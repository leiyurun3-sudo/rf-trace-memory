    <dc:description>Task-weighted paired pattern_ncc_shift6 differences; stored estimates from tables/evidence_paired_contrasts.csv. Six source clusters and 14 task-seed pairs per contrast; 100000 percentile source-cluster bootstrap resamples. Dog/rain and dog/snow share a resampling cluster. Regional means spectral ROUTE25; uniform means ROI_UNIFORM25; memory on/off uses LOCAL. Exact signs and intervals unchanged.</dc:description>
