for(const key of ['edit_ok','subject_ok','artifact']){const l=document.createElement('label');l.textContent=key;const s=document.createElement('select');for(const [v,t] of [['','Pending'],['0','0'],['1','1']]){const o=document.createElement('option');o.value=v;o.textContent=t;s.append(o);}s.value=item[key]===null?'':String(item[key]);s.onchange=()=>item[key]=s.value===''?null:Number(s.value);l.append(s);a.append(l);}document.querySelector('main').append(a);});
document.querySelector('#export').onclick=()=>{const reviews=items.map(({jobid,preview_sha256,edit_ok,subject_ok,artifact})=>({jobid,preview_sha256,edit_ok,subject_ok,artifact}));const blob=new Blob([JSON.stringify({schema:'r71-human-review-v1',fingerprint,reviews},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='R71_review.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
</script>
